<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Reader</title>
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>

<input id="kbd" autofocus placeholder="Scan a card here (keyboard mode)" autocomplete="off">
<button id="usb">USB reader</button>
<button id="nfc">Phone NFC</button>
<ol id="reads"></ol>

<script>
const reads = document.getElementById('reads');
const canon = s => s.replace(/[^0-9a-fA-F]/g, '').toUpperCase();

let last = '', lastAt = 0;

function show(text) {
  const now = Date.now();
  if (text === last && now - lastAt < 1500) { lastAt = now; return; }
  last = text; lastAt = now;
  const li = document.createElement('li');
  li.textContent = new Date().toLocaleTimeString() + '  ' + text;
  reads.append(li);
  while (reads.children.length > 10) reads.firstChild.remove();
}

// A wedge types the UID as keystrokes. Most send Enter at the end, but not all,
// so also flush once typing stops. Refocus so the keystrokes never go astray.
let t;
const flush = () => {
  const v = kbd.value.trim();
  kbd.value = '';
  if (v) show(canon(v) + ' KBD');
};
kbd.oninput = () => { clearTimeout(t); t = setTimeout(flush, 200); };
kbd.onkeydown = e => { if (e.key === 'Enter') { clearTimeout(t); flush(); } };
addEventListener('click', () => kbd.focus());

let active = false;

async function readUSB(dev) {
  if (active) return;
  active = true;
  try {
    if (!dev.opened) await dev.open();
    if (!dev.configuration) await dev.selectConfiguration(1);
    const itf = dev.configuration.interfaces.find(i => i.alternates[0].interfaceClass === 0xff);
    if (!itf) throw new Error('no vendor interface — reader not in WebUSB mode');
    const ep = itf.alternates[0].endpoints.find(e => e.direction === 'in');
    await dev.claimInterface(itf.interfaceNumber);
    show('connected');
    for (;;) {
      const r = await dev.transferIn(ep.endpointNumber, ep.packetSize);
      if (r.data?.byteLength) show(canon(new TextDecoder().decode(r.data)) + ' USB');
    }
  } catch (e) {
    active = false;
    show(e.message);
  }
}

usb.onclick = () => navigator.usb.requestDevice({ filters: [{ vendorId: 0x04d8, productId: 0xfc27 }] })
  .then(readUSB).catch(e => show(e.message));

nfc.onclick = async () => {
  try {
    const r = new NDEFReader();
    await r.scan();
    show('scanning');
    r.onreading = e => show(canon(e.serialNumber || '') + ' NFC');
  } catch (e) { show(e.message); }
};

navigator.usb?.getDevices().then(d => d[0] && readUSB(d[0]));
navigator.serviceWorker?.register('sw.js');
</script>

</body>
</html>
